<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liev Dorfman</title>
<meta name="description" content="Robotics software and infrastructure. FRC Team 59 (RAMTECH) robot code, a Spotify TV dashboard that ships as a bootable Linux image, drone swarms, and a self-hosted homelab.">
<meta name="theme-color" content="#080b11">
<meta property="og:type" content="website">
<meta property="og:url" content="https://l13v.dev">
<meta property="og:title" content="Liev Dorfman — robotics software &amp; infrastructure">
<meta property="og:description" content="FRC 59 robot code, a Spotify TV dashboard that ships as a bootable Linux image, drone swarms, and a self-hosted homelab.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2032%2032%22%3E%3Crect%20width=%2232%22%20height=%2232%22%20rx=%227%22%20fill=%22%23080b11%22/%3E%3Ctext%20x=%2216%22%20y=%2222%22%20font-family=%22monospace%22%20font-size=%2216%22%20font-weight=%22700%22%20fill=%22%234d8cff%22%20text-anchor=%22middle%22%3EL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Technical structure, turned up: dark ground, a per-project accent drawn from
   one harmonious set, and motion that points at things instead of decorating. */
:root{
  --bg:#080b11; --bg-2:#0e131c; --bg-3:#151c28; --bg-4:#1d2534;
  --fg:#eaeff7; --fg-2:#9aa7bd; --fg-3:#6b7793;
  --line:rgba(234,239,247,.12); --line-2:rgba(234,239,247,.22);

  --brand:#4d8cff; --brand-2:#22d3ee;
  --grad:linear-gradient(100deg,#4d8cff,#22d3ee);

  /* project accents — one set, so six colours still read as a family */
  --a-red:#ff3d57; --a-cyan:#22d3ee; --a-lime:#a3e635;
  --a-violet:#a78bfa; --a-amber:#fbbf24; --a-blue:#60a5fa;

  --pa:var(--brand);          /* current project accent, set per section */
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gut:clamp(1.15rem,4vw,3rem);
  --r:7px;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{height:100%; scroll-behavior:smooth; scroll-padding-top:84px}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--fg);
  font-family:var(--sans); font-size:1.02rem; line-height:1.62;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  background-image:radial-gradient(rgba(234,239,247,.045) 1px, transparent 1px);
  background-size:30px 30px; background-position:-1px -1px;
}
img,video{max-width:100%; display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand-2); outline-offset:3px; border-radius:3px}
::selection{background:var(--brand); color:#fff}
.wrap{max-width:1300px; margin:0 auto; padding-inline:var(--gut)}
.mono{font-family:var(--mono)}
.lbl{font-family:var(--mono); font-size:.64rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--fg-3)}

/* ── scroll progress ─────────────────────────── */
#bar{position:fixed; top:0; left:0; height:2px; width:0; z-index:400; background:var(--grad); box-shadow:0 0 12px rgba(77,140,255,.7)}

/* ── header ──────────────────────────────────── */
header{
  position:sticky; top:0; z-index:300;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid var(--line);
}
.hd{display:flex; align-items:center; gap:1rem; min-height:60px; flex-wrap:wrap}
.hd-lead{display:flex; align-items:center; gap:.6rem; min-width:0}
.hd-name{
  font-weight:700; letter-spacing:-.02em; font-size:.98rem; margin:0; white-space:nowrap;
  /* Hand-off: while the big heading is on screen this is hidden, and it eases
     in only once that heading has scrolled up behind the bar. The two are
     never visible at the same time. */
  opacity:0; transform:translateY(-7px);
  transition:opacity .4s ease, transform .4s ease;
}
header.named .hd-name{opacity:1; transform:none}
.hd-name em{font-style:normal; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.dot{width:7px; height:7px; border-radius:50%; background:var(--a-lime); box-shadow:0 0 0 0 rgba(163,230,53,.6); animation:ping 2.4s ease-out infinite; flex:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(163,230,53,.55)}70%{box-shadow:0 0 0 9px rgba(163,230,53,0)}100%{box-shadow:0 0 0 0 rgba(163,230,53,0)}}
.hd-role{font-family:var(--mono); font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--fg-3); padding-left:1rem; border-left:1px solid var(--line); }
.hd nav{margin-left:auto; display:flex; gap:1.4rem; flex-wrap:wrap}
.hd nav a{font-family:var(--mono); font-size:.68rem; letter-spacing:.11em; text-transform:uppercase; color:var(--fg-2); text-decoration:none; position:relative; padding-block:.3rem}
.hd nav a::after{content:""; position:absolute; left:0; right:100%; bottom:0; height:1.5px; background:var(--grad); transition:right .32s cubic-bezier(.2,.7,.2,1)}
.hd nav a:hover{color:var(--fg)}
.hd nav a:hover::after{right:0}

/* ── hero ────────────────────────────────────── */
.hero{position:relative; padding-block:clamp(1.6rem,3.5vw,2.8rem) clamp(1.4rem,3.5vw,2.4rem); overflow:hidden}
.glow{
  position:absolute; inset:-30% -15% auto -15%; height:700px; z-index:0; pointer-events:none;
  background:
    radial-gradient(42% 46% at 22% 42%, rgba(77,140,255,.28), transparent 72%),
    radial-gradient(38% 42% at 72% 26%, rgba(255,61,87,.20), transparent 72%),
    radial-gradient(34% 40% at 52% 68%, rgba(34,211,238,.16), transparent 72%);
  filter:blur(26px); animation:drift 26s ease-in-out infinite alternate;
}
@keyframes drift{from{transform:translate3d(-2%,0,0) scale(1)}to{transform:translate3d(3%,-3%,0) scale(1.1)}}
/* must exclude .glow — it is absolutely positioned and this would reset it */
.hero > *:not(.glow){position:relative; z-index:1}
.eyebrow{display:inline-flex; align-items:center; gap:.65rem; margin:0 0 1.5rem; padding:.42rem .8rem; border:1px solid var(--line-2); border-radius:100px; background:rgba(14,19,28,.6)}
.eyebrow b{font-family:var(--mono); font-size:.64rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--fg-2)}
h1{
  font-weight:800; font-size:clamp(2.5rem,8.6vw,6.1rem); line-height:.92; letter-spacing:-.045em;
  margin:0 0 1.15rem; text-transform:uppercase; text-wrap:balance;
}
h1 em{font-style:normal; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.hero-cols{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:clamp(1.4rem,4vw,3.5rem); align-items:start}
.lede{font-size:clamp(1.05rem,1.9vw,1.38rem); line-height:1.45; letter-spacing:-.015em; font-weight:500; margin:0; max-width:32ch}
.lede em{font-style:normal; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.sub{font-size:1rem; color:var(--fg-2); margin:0; max-width:50ch}
.cta{display:flex; gap:.7rem; flex-wrap:wrap; margin-top:2.1rem}
.btn{
  font-family:var(--mono); font-size:.7rem; font-weight:600; letter-spacing:.13em; text-transform:uppercase;
  text-decoration:none; padding:.78rem 1.25rem; border-radius:var(--r); border:1px solid var(--line-2);
  color:var(--fg); display:inline-flex; align-items:center; gap:.5rem; position:relative; overflow:hidden;
  transition:transform .2s, border-color .2s, box-shadow .2s, color .2s;
}
.btn:hover{transform:translateY(-2px); border-color:var(--brand); box-shadow:0 8px 28px -12px rgba(77,140,255,.6)}
.btn-1{background:var(--grad); border-color:transparent; color:#06121f; font-weight:700}
.btn-1:hover{box-shadow:0 10px 32px -10px rgba(34,211,238,.65)}

/* ── plates ──────────────────────────────────── */
.plates{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(.7rem,1.8vw,1.1rem)}
.plates > :first-child{grid-column:1 / -1}
.plates.single{grid-template-columns:1fr}
figure{margin:0; min-width:0}
.frame{
  position:relative; width:100%; padding:0; display:block; overflow:hidden;
  border:1px solid var(--line); border-radius:var(--r); background:var(--bg-2);
  aspect-ratio:16/10; transition:border-color .25s, box-shadow .25s, transform .25s;
}
.hero-plate .frame{aspect-ratio:21/9}
button.frame{cursor:zoom-in}
button.frame:hover{border-color:var(--pa); transform:translateY(-3px); box-shadow:0 16px 40px -20px color-mix(in srgb, var(--pa) 70%, transparent)}
.frame img,.frame video{width:100%; height:100%; object-fit:cover; transition:transform .5s cubic-bezier(.2,.6,.2,1)}
button.frame:hover img,button.frame:hover video{transform:scale(1.04)}
.frame img.contain{object-fit:contain; background:var(--bg-3); padding:10px}
/* sweep */
button.frame::after{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:0;
  background:linear-gradient(105deg, transparent 38%, color-mix(in srgb, var(--pa) 26%, transparent) 50%, transparent 62%);
  transform:translateX(-70%); transition:opacity .2s;
}
button.frame:hover::after{opacity:1; animation:sweep .75s ease-out}
@keyframes sweep{to{transform:translateX(70%)}}
.frame.empty{
  display:grid; place-items:center; cursor:default;
  background:
    repeating-linear-gradient(45deg, rgba(234,239,247,.045) 0 1px, transparent 1px 11px),
    radial-gradient(70% 70% at 50% 50%, color-mix(in srgb, var(--pa) 9%, transparent), transparent 75%);
  border-style:dashed; border-color:var(--line-2);
}
/* ── live 3D plate ───────────────────────────── */
.plate-model .frame{aspect-ratio:4/3; cursor:grab}
.plate-model .frame:active{cursor:grabbing}
.frame.model canvas{position:relative; z-index:1; display:block}
.model-load{
  position:absolute; inset:0; z-index:2; display:grid; place-items:center;
  background-size:cover; background-position:center;
  transition:opacity .55s ease; opacity:1;
}
.model-load::before{content:""; position:absolute; inset:0; background:rgba(8,11,17,.72)}
.model-load span{
  position:relative; font-family:var(--mono); font-size:.64rem; letter-spacing:.16em;
  text-transform:uppercase; color:var(--fg-2); background:rgba(8,11,17,.8);
  border:1px solid var(--line); border-radius:100px; padding:.45rem .85rem;
  display:flex; align-items:center; gap:.5rem;
}
.model-load span::before{
  content:""; width:9px; height:9px; border-radius:50%; border:1.5px solid var(--pa);
  border-top-color:transparent; animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.frame.model.ready .model-load{opacity:0; pointer-events:none}
.frame.model.failed .model-load span::before{display:none}
.model-tag,.model-exp{
  position:absolute; bottom:10px; z-index:3; font-family:var(--mono); font-size:.58rem;
  letter-spacing:.14em; text-transform:uppercase; border-radius:100px;
  background:rgba(8,11,17,.8); border:1px solid var(--line-2); color:var(--fg-2);
  padding:.34rem .7rem; backdrop-filter:blur(6px);
}
.model-tag{left:10px; pointer-events:none; display:flex; align-items:center; gap:.45rem}
.model-tag i{width:5px; height:5px; border-radius:50%; background:var(--pa); flex:none}
.model-exp{right:10px; cursor:pointer; transition:color .2s, border-color .2s}
.model-exp:hover{color:var(--pa); border-color:var(--pa)}
.lb-model{width:min(100%,1150px); aspect-ratio:16/10; max-height:100%; position:relative; border-radius:var(--r); overflow:hidden; background:#0b0e14; cursor:grab}
.lb-model:active{cursor:grabbing}

.empty-note{display:flex; align-items:center; gap:.55rem; font-family:var(--mono); font-size:.64rem; letter-spacing:.16em; text-transform:uppercase; color:var(--fg-3); background:rgba(8,11,17,.75); padding:.45rem .8rem; border:1px solid var(--line); border-radius:100px}
.empty-note i{width:6px; height:6px; border-radius:50%; background:var(--pa); flex:none; animation:blink 2.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
figcaption{font-family:var(--mono); font-size:.68rem; line-height:1.5; color:var(--fg-2); padding-top:.6rem; display:flex; gap:.6rem; align-items:baseline}
.fig{color:var(--pa); font-weight:600; letter-spacing:.07em; white-space:nowrap}
.play{position:absolute; inset:0; display:grid; place-items:center; pointer-events:none}
.play i{width:56px; height:56px; border-radius:50%; background:color-mix(in srgb, var(--pa) 82%, transparent); display:grid; place-items:center; box-shadow:0 8px 30px -8px color-mix(in srgb, var(--pa) 80%, transparent)}
.play i::after{content:""; border-style:solid; border-width:9px 0 9px 15px; border-color:transparent transparent transparent #06121f; margin-left:4px}

/* ── project sheets ──────────────────────────── */
.sheet{padding-block:clamp(2.4rem,6vw,4rem); border-top:1px solid var(--line); position:relative}
.sheet::before{content:""; position:absolute; top:-1px; left:0; width:84px; height:2px; background:var(--pa); box-shadow:0 0 14px color-mix(in srgb, var(--pa) 75%, transparent)}
.sh-head{display:flex; gap:.85rem; align-items:center; flex-wrap:wrap; margin-bottom:1.1rem}
.sh-no{font-family:var(--mono); font-size:.74rem; font-weight:600; letter-spacing:.1em; color:var(--pa)}
.sh-sep{color:var(--line-2)}
.chip{
  margin-left:auto; display:inline-flex; align-items:center; gap:.5rem;
  font-family:var(--mono); font-size:.62rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
  padding:.35rem .7rem; border-radius:100px;
  color:var(--pa); border:1px solid color-mix(in srgb, var(--pa) 45%, transparent);
  background:color-mix(in srgb, var(--pa) 11%, transparent);
}
.chip i{width:6px; height:6px; border-radius:50%; background:var(--pa); flex:none}
.chip.live i{animation:ping2 2s ease-out infinite}
@keyframes ping2{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--pa) 60%, transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
h2{font-weight:700; font-size:clamp(1.5rem,3.4vw,2.3rem); line-height:1.08; letter-spacing:-.03em; margin:0 0 1.6rem; max-width:24ch; text-wrap:balance}
/* Media sits BESIDE the prose, not under it — otherwise a project's height is
   text + images stacked and nothing fits on one screen. */
.sh-body{display:grid; grid-template-columns:minmax(0,1.08fr) minmax(0,1fr); gap:clamp(1.4rem,3vw,2.8rem); align-items:start}
.sh-body.no-media{grid-template-columns:minmax(0,1fr)}
.sh-media,.sh-text{min-width:0}
.summary{font-size:1.05rem; line-height:1.6; margin:0 0 1.5rem; max-width:54ch; letter-spacing:-.008em}
ol.notes{list-style:none; counter-reset:n; margin:0 0 1.6rem; padding:0; display:flex; flex-direction:column; gap:.95rem; max-width:58ch}
ol.notes li{counter-increment:n; display:grid; grid-template-columns:2.1rem 1fr; font-size:.95rem; line-height:1.6; color:var(--fg-2)}
ol.notes li::before{
  content:counter(n,decimal-leading-zero); font-family:var(--mono); font-size:.68rem; font-weight:600;
  color:var(--pa); padding-top:.3rem; letter-spacing:.06em;
}
.sh-links{display:flex; gap:.6rem; flex-wrap:wrap}
.plink{
  font-family:var(--mono); font-size:.66rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase;
  text-decoration:none; padding:.5rem .85rem; border-radius:var(--r);
  border:1px solid var(--line-2); color:var(--fg-2); transition:color .2s, border-color .2s, background-color .2s;
}
.plink:hover{color:var(--pa); border-color:var(--pa); background:color-mix(in srgb, var(--pa) 10%, transparent)}

.spec-block{margin:0 0 1.5rem}
.spec-block > .lbl{display:block; padding-bottom:.6rem; border-bottom:1px solid var(--line); margin-bottom:.2rem}
dl.spec{margin:0}
.srow{display:flex; align-items:baseline; gap:.55rem; padding:.5rem .55rem; margin-inline:-.55rem; border-radius:5px; transition:background-color .18s}
.srow:hover{background:color-mix(in srgb, var(--pa) 9%, transparent)}
.srow dt{font-family:var(--mono); font-size:.7rem; letter-spacing:.05em; text-transform:uppercase; color:var(--fg-3); white-space:nowrap}
.srow .ldr{flex:1 1 auto; min-width:.8rem; border-bottom:1px dotted var(--line-2); transform:translateY(-.22em)}
.srow dd{margin:0; font-family:var(--mono); font-size:.75rem; color:var(--fg); text-align:right; min-width:0}
.repo{margin-top:1rem; padding-top:.8rem; border-top:1px solid var(--line); font-family:var(--mono); font-size:.66rem; color:var(--fg-3); display:flex; gap:.9rem; flex-wrap:wrap}

/* ── tail ────────────────────────────────────── */
.cap{margin:0; border-top:1px solid var(--line)}
.cap > div{display:grid; grid-template-columns:minmax(0,170px) minmax(0,1fr); gap:1.4rem; padding:1rem .6rem; margin-inline:-.6rem; border-bottom:1px solid var(--line); align-items:baseline; border-radius:5px; transition:background-color .2s}
.cap > div:hover{background:rgba(234,239,247,.035)}
.cap dt{font-family:var(--mono); font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:600}
.cap dd{margin:0; font-size:.94rem; color:var(--fg-2); line-height:1.6}
.bench{display:grid; grid-template-columns:repeat(auto-fit,minmax(245px,1fr)); gap:1rem; margin-top:2rem}
.bcard{border:1px solid var(--line); border-radius:var(--r); padding:1.25rem; background:var(--bg-2); transition:border-color .25s, transform .25s}
.bcard:nth-child(1){--pa:var(--a-cyan)} .bcard:nth-child(2){--pa:var(--a-violet)} .bcard:nth-child(3){--pa:var(--a-amber)}
.bcard:hover{border-color:var(--pa); transform:translateY(-3px)}
.bcard h3{font-family:var(--mono); font-size:.7rem; letter-spacing:.13em; text-transform:uppercase; color:var(--pa); margin:0 0 .7rem}
.bcard p{margin:0; font-size:.92rem; line-height:1.65; color:var(--fg-2)}

footer{border-top:1px solid var(--line); margin-top:clamp(2rem,5vw,3.5rem)}
.foot{display:flex; gap:1.2rem; flex-wrap:wrap; align-items:center; justify-content:space-between; padding-block:1.8rem calc(1.8rem + env(safe-area-inset-bottom,0px))}
.foot a{font-family:var(--mono); font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; text-decoration:none; color:var(--fg-2)}
.foot a:hover{color:var(--brand-2)}
.foot nav{display:flex; gap:1.2rem; flex-wrap:wrap}

/* ── reveal on scroll (only when JS is on) ──── */
.js [data-rev]{opacity:0; transform:translateY(16px)}
.js [data-rev].in{animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1; transform:none}}
/* hero animates straight away, no observer */
.hz{animation:rise .75s cubic-bezier(.2,.7,.2,1) backwards}

/* ── lightbox ────────────────────────────────── */
.lb{position:fixed; inset:0; z-index:500; display:grid; grid-template-rows:auto 1fr auto; background:rgba(5,7,11,.97); backdrop-filter:blur(8px); padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.lb[hidden]{display:none!important}
.lb-bar{display:flex; gap:1rem; align-items:center; padding:.95rem var(--gut); border-bottom:1px solid rgba(255,255,255,.1)}
.lb-fig{font-family:var(--mono); font-size:.68rem; font-weight:600; letter-spacing:.14em; color:var(--pa)}
.lb-ct{font-family:var(--mono); font-size:.68rem; letter-spacing:.12em; color:#8e9bb0; margin-left:.2rem}
.lb-btn{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.22); color:#eaeff7; width:38px; height:38px; border-radius:50%; cursor:pointer; display:grid; place-items:center; flex:none; font-size:1rem; transition:background-color .2s, border-color .2s}
.lb-btn:hover{background:color-mix(in srgb, var(--brand) 32%, transparent); border-color:var(--brand)}
.lb-x{margin-left:auto}
.lb-stage{position:relative; display:grid; place-items:center; min-height:0; padding:clamp(.6rem,2vw,1.5rem) clamp(.5rem,5vw,4.5rem)}
.lb-stage img,.lb-stage video,.lb-stage iframe{max-width:100%; max-height:100%; width:auto; height:auto; border-radius:var(--r); background:#000; box-shadow:0 30px 80px -30px rgba(0,0,0,.9)}
.lb-stage iframe{width:min(100%,1080px); aspect-ratio:16/9; height:auto; border:0}
.lb-nav{position:absolute; top:50%; transform:translateY(-50%)}
.lb-prev{left:clamp(.25rem,1.5vw,1rem)} .lb-next{right:clamp(.25rem,1.5vw,1rem)}
.lb-cap{margin:0; padding:.95rem var(--gut) 1.4rem; font-family:var(--mono); font-size:.76rem; line-height:1.55; color:#9aa7bd; text-align:center}

/* two columns need real room; below this the media goes back above the prose */
@media (max-width:980px){
  .sh-body,.sh-body.no-media{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:880px){
  .hero-cols{grid-template-columns:1fr}
  .hd-role{display:none}
}
@media (max-width:560px){
  .plates{grid-template-columns:1fr}
  .chip{margin-left:0}
  .cap > div{grid-template-columns:1fr; gap:.25rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important; transition:none!important}
  html{scroll-behavior:auto}
  .js [data-rev]{opacity:1!important; transform:none!important}
  /* no scroll, so wrap one copy and drop the loop duplicate */
  .track{width:auto; flex-wrap:wrap; gap:1.4rem}
  .track .dup{display:none}
}
</style>

<script src="projects.js"></script>
<script>
(function () {
  "use strict";
  document.documentElement.classList.add("js");

  var ACCENTS = ["--a-red", "--a-cyan", "--a-lime", "--a-violet", "--a-amber", "--a-blue"];
  function el(t, c, x) { var n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; }
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  /* header + hero */
  document.getElementById("hd-role").textContent = SITE.role;
  document.getElementById("eyebrow").textContent = SITE.team;
  document.getElementById("sub").textContent = SITE.intro2;
  document.getElementById("yr").textContent = String(new Date().getFullYear());

  /* the big heading, surname in the gradient; the bar gets a plain copy */
  var parts = SITE.name.split(" ");
  var given = parts.slice(0, -1).join(" ");
  var surname = parts[parts.length - 1];

  var h1 = document.getElementById("h1");
  h1.appendChild(document.createTextNode(given + " "));
  h1.appendChild(el("em", null, surname));

  var hdName = document.getElementById("hd-name");
  hdName.appendChild(document.createTextNode(given + " "));
  hdName.appendChild(el("em", null, surname));

  /* the opening statement, with one phrase picked out in the gradient */
  var ledeEl = document.getElementById("lede");
  var phrase = SITE.highlight;
  var at = phrase ? SITE.intro.indexOf(phrase) : -1;
  if (at >= 0) {
    ledeEl.appendChild(document.createTextNode(SITE.intro.slice(0, at)));
    ledeEl.appendChild(el("em", null, phrase));
    ledeEl.appendChild(document.createTextNode(SITE.intro.slice(at + phrase.length)));
  } else {
    ledeEl.textContent = SITE.intro;
  }

  var cta = document.getElementById("cta");
  SITE.links.forEach(function (l, i) {
    var a = el("a", "btn" + (i === 0 ? " btn-1" : ""), l.label);
    a.href = l.href; a.rel = "noopener"; cta.appendChild(a);
  });
  var w = el("a", "btn", "See the work"); w.href = "#work"; cta.appendChild(w);

  /* ── media ── */
  var ALL = [], figNo = 0;
  function src(slug, f) { return "media/" + slug + "/" + f; }

  function thumb(slug, m) {
    if (m.type === "youtube") { var y = el("img"); y.src = "https://img.youtube.com/vi/" + m.id + "/hqdefault.jpg"; y.alt = m.caption || ""; y.loading = "lazy"; return y; }
    if (m.type === "video") {
      if (m.poster) { var p = el("img"); p.src = src(slug, m.poster); p.alt = m.caption || ""; p.loading = "lazy"; return p; }
      var v = el("video"); v.src = src(slug, m.file); v.preload = "metadata"; v.muted = true; v.playsInline = true; return v;
    }
    var i = el("img"); i.src = src(slug, m.file); i.alt = m.caption || ""; i.loading = "lazy";
    if (/\.svg$/i.test(m.file)) i.className = "contain";
    return i;
  }

  /* three.js arrives as a module, which is deferred — so a mount may be
     requested before it exists. Queue until it announces itself. */
  function mount3D(host, url, opts, onReady) {
    function go() {
      var h = null;
      try { h = window.__mount3D(host, url, opts || {}); } catch (e) { host.classList.add("failed"); }
      if (onReady) onReady(h);
    }
    if (window.__mount3D) { go(); }
    else { document.addEventListener("three-ready", go, { once: true }); }
  }

  /* lighting options travel on the element so a lazy mount can read them back */
  function optsOf(m) {
    var o = {};
    if (typeof m.exposure === "number") o.exposure = m.exposure;
    if (typeof m.env === "number") o.env = m.env;
    if (m.ao === false) o.ao = false;
    return o;
  }

  /* Only build a WebGL context once the plate is actually near the screen. */
  function mountHost(host) {
    if (host.getAttribute("data-mounted")) return;
    host.setAttribute("data-mounted", "1");
    var o = {};
    try { o = JSON.parse(host.getAttribute("data-model-opts") || "{}"); } catch (e) {}
    mount3D(host, host.getAttribute("data-model"), o);
  }
  var lazy3D = "IntersectionObserver" in window
    ? new IntersectionObserver(function (es) {
        es.forEach(function (e) {
          if (!e.isIntersecting) return;
          lazy3D.unobserve(e.target);
          mountHost(e.target);
        });
      }, { rootMargin: "300px" })
    : null;
  /* Failsafe: some environments never deliver intersection callbacks at all
     (a backgrounded tab, some embedded views). The model is the point of this
     page, so mount anything still waiting shortly after load. */
  setTimeout(function () {
    Array.prototype.forEach.call(document.querySelectorAll("[data-model]"), mountHost);
  }, 2500);

  function plate(slug, m, hero, accent) {
    figNo += 1;
    var no = figNo, fig = el("figure", hero ? "hero-plate" : null), cap = el("figcaption");

    if (m && m.type === "model") {
      fig.className = (fig.className ? fig.className + " " : "") + "plate-model";
      var idxM = ALL.length;
      ALL.push({ slug: slug, m: m, no: no, accent: accent || "--brand" });

      var host = el("div", "frame model");
      host.setAttribute("data-model", src(slug, m.file));
      host.setAttribute("data-model-opts", JSON.stringify(optsOf(m)));

      var load = el("div", "model-load");
      if (m.poster) { load.style.backgroundImage = "url('" + src(slug, m.poster) + "')"; }
      load.appendChild(el("span", null, "Loading 3D"));
      host.appendChild(load);

      var tag = el("div", "model-tag");
      tag.appendChild(el("i"));
      tag.appendChild(document.createTextNode("Live 3D · drag to orbit"));
      host.appendChild(tag);

      var exp = el("button", "model-exp", "Expand");
      exp.type = "button";
      exp.setAttribute("aria-label", "Open the 3D model full screen");
      exp.addEventListener("click", function () { open(idxM); });
      host.appendChild(exp);

      fig.appendChild(host);
      cap.appendChild(el("span", "fig", "FIG " + pad(no)));
      cap.appendChild(el("span", null, m.caption || ""));
      fig.appendChild(cap);

      if (lazy3D) { lazy3D.observe(host); } else { mountHost(host); }
      /* nothing below this line needs the host again */
      return fig;
    }

    if (m) {
      var idx = ALL.length;
      ALL.push({ slug: slug, m: m, no: no, accent: accent || "--brand" });
      var b = el("button", "frame"); b.type = "button";
      b.setAttribute("aria-label", "Enlarge figure " + pad(no));
      b.appendChild(thumb(slug, m));
      if (m.type === "video" || m.type === "youtube") { var pl = el("div", "play"); pl.appendChild(el("i")); b.appendChild(pl); }
      b.addEventListener("click", function () { open(idx); });
      fig.appendChild(b);
      cap.appendChild(el("span", "fig", "FIG " + pad(no)));
      cap.appendChild(el("span", null, m.caption || ""));
    } else {
      var d = el("div", "frame empty");
      var note = el("span", "empty-note");
      note.appendChild(el("i"));
      note.appendChild(document.createTextNode("Photo slot"));
      d.appendChild(note);
      fig.appendChild(d);
      cap.appendChild(el("span", "fig", "FIG " + pad(no)));
      cap.appendChild(el("span", null, "Reserved"));
    }
    fig.appendChild(cap);
    return fig;
  }

  function plateSet(slug, media, count, hero, accent) {
    var items = (media || []).slice();
    var n = SHOW_PLACEHOLDERS ? (count || 0) : 0;
    if (!items.length && !n) return null;
    var box = el("div", "plates");
    items.forEach(function (m, i) { box.appendChild(plate(slug, m, hero && i === 0, accent)); });
    for (var k = 0; k < n; k++) box.appendChild(plate(slug, null, hero && !items.length && k === 0, accent));
    if (box.children.length === 1) box.className = "plates single";
    return box;
  }

  /* ── sheets ── */
  var sheets = document.getElementById("sheets"), repoLines = {}, total = PROJECTS.length;
  var first = document.createElement("div");
  first.id = "work";
  sheets.appendChild(first);

  PROJECTS.forEach(function (p, i) {
    var s = el("section", "sheet");
    var accent = ACCENTS[i % ACCENTS.length];
    s.style.setProperty("--pa", "var(" + accent + ")");
    s.setAttribute("data-rev", "");

    var head = el("div", "sh-head");
    head.appendChild(el("span", "sh-no", pad(i + 1) + " / " + pad(total)));
    head.appendChild(el("span", "sh-sep", "/"));
    head.appendChild(el("span", "lbl", p.kind));
    head.appendChild(el("span", "sh-sep", "/"));
    head.appendChild(el("span", "lbl", p.period));
    if (p.status) {
      var c = el("span", "chip" + (/season/i.test(p.status) ? " live" : ""));
      c.appendChild(el("i"));
      c.appendChild(document.createTextNode(p.status));
      head.appendChild(c);
    }
    s.appendChild(head);
    s.appendChild(el("h2", null, p.title));

    var body = el("div", "sh-body");

    var ps = plateSet(p.slug, p.media, p.placeholders, false, accent);
    if (ps) {
      var mcol = el("div", "sh-media");
      mcol.appendChild(ps);
      body.appendChild(mcol);
    } else {
      body.className = "sh-body no-media";
    }

    var text = el("div", "sh-text");
    text.appendChild(el("p", "summary", p.summary));
    if (p.notes && p.notes.length) {
      var ol = el("ol", "notes");
      p.notes.forEach(function (t) { var li = document.createElement("li"); li.appendChild(el("span", null, t)); ol.appendChild(li); });
      text.appendChild(ol);
    }

    if (p.specs && p.specs.length) {
      var sb = el("div", "spec-block");
      sb.appendChild(el("span", "lbl", "Specification"));
      var dl = el("dl", "spec");
      p.specs.forEach(function (row) {
        var r = el("div", "srow");
        r.appendChild(el("dt", null, row[0]));
        r.appendChild(el("span", "ldr"));
        r.appendChild(el("dd", null, row[1]));
        dl.appendChild(r);
      });
      sb.appendChild(dl);
      var rl = el("div", "repo");
      rl.appendChild(el("span", null, p.repo));
      repoLines[p.repo] = rl;
      sb.appendChild(rl);
      text.appendChild(sb);
    }

    var lk = el("div", "sh-links");
    (p.links || []).forEach(function (l) { var a = el("a", "plink", l.label); a.href = l.href; a.rel = "noopener"; lk.appendChild(a); });
    text.appendChild(lk);

    body.appendChild(text);
    s.appendChild(body);

    sheets.appendChild(s);
  });

  var cap = document.getElementById("cap");
  STACK.forEach(function (row) { var d = el("div"); d.appendChild(el("dt", null, row[0])); d.appendChild(el("dd", null, row[1])); cap.appendChild(d); });
  var bench = document.getElementById("bench");
  BENCH.forEach(function (row) { var d = el("div", "bcard"); d.appendChild(el("h3", null, row[0])); d.appendChild(el("p", null, row[1])); bench.appendChild(d); });

  /* ── scroll progress ── */
  var bar = document.getElementById("bar");
  var header = document.querySelector("header");
  var bigName = document.getElementById("h1");
  function prog() {
    var h = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + "%";
    /* Hand off only once the big heading has actually gone up behind the bar,
       measured rather than guessed at a pixel offset — so the two are never
       both on screen at any window size. */
    var gone = bigName
      ? bigName.getBoundingClientRect().bottom < header.offsetHeight - 2
      : window.scrollY > 140;
    header.classList.toggle("named", gone);
  }
  addEventListener("scroll", prog, { passive: true });
  addEventListener("resize", prog);
  prog();

  /* ── reveal ── */
  var revs = document.querySelectorAll("[data-rev]");
  function revealAll() { revs.forEach(function (n) { n.classList.add("in"); }); }
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
      });
    }, { rootMargin: "0px 0px -8% 0px", threshold: .04 });
    revs.forEach(function (n) { io.observe(n); });
    /* Failsafe: a reveal animation must never be the reason something is
       unreadable. If anything is still hidden after 3s, show everything. */
    setTimeout(revealAll, 3000);
  } else {
    revealAll();
  }

  /* ── viewer ── */
  var lb = document.getElementById("lb"), stage = document.getElementById("lb-stage");
  var capN = document.getElementById("lb-cap"), figN = document.getElementById("lb-fig"), ctN = document.getElementById("lb-ct");
  var prev = document.getElementById("lb-prev"), next = document.getElementById("lb-next"), x = document.getElementById("lb-x");
  var at = 0, back = null, node = null, lbViewer = null, mountToken = 0;

  function clear() {
    mountToken += 1;                 /* invalidates any mount still in flight */
    if (lbViewer && lbViewer.dispose) { lbViewer.dispose(); }
    lbViewer = null;
    if (node && node.parentNode) node.parentNode.removeChild(node);
    node = null;
  }
  function show() {
    clear();
    var f = ALL[at], m = f.m, n, mountUrl = null, mountOpts = null;
    lb.style.setProperty("--pa", "var(" + f.accent + ")");
    if (m.type === "model") {
      n = document.createElement("div");
      n.className = "lb-model";
      mountUrl = src(f.slug, m.file);   /* mounted after it is in the DOM */
      mountOpts = optsOf(m);
    } else if (m.type === "youtube") {
      n = document.createElement("iframe");
      n.src = "https://www.youtube-nocookie.com/embed/" + m.id + "?autoplay=1&rel=0";
      n.allow = "autoplay; encrypted-media; picture-in-picture";
      n.setAttribute("allowfullscreen", ""); n.title = m.caption || "Video";
    } else if (m.type === "video") {
      n = document.createElement("video"); n.src = src(f.slug, m.file);
      n.controls = true; n.autoplay = true; n.playsInline = true;
      if (m.poster) n.poster = src(f.slug, m.poster);
    } else { n = document.createElement("img"); n.src = src(f.slug, m.file); n.alt = m.caption || ""; }
    node = n; stage.appendChild(n);
    if (mountUrl) {
      var token = mountToken;
      mount3D(n, mountUrl, mountOpts, function (h) {
        /* closed or stepped away while three.js was still loading */
        if (token !== mountToken) { if (h && h.dispose) { h.dispose(); } return; }
        lbViewer = h;
      });
    }
    capN.textContent = m.caption || "";
    figN.textContent = "FIG " + pad(f.no);
    ctN.textContent = (at + 1) + " of " + ALL.length;
    prev.hidden = next.hidden = ALL.length < 2;
  }
  function open(i) {
    at = i; back = document.activeElement;
    lb.hidden = false; document.body.style.overflow = "hidden"; show(); x.focus();
  }
  function close() { clear(); lb.hidden = true; document.body.style.overflow = ""; if (back && back.focus) back.focus(); }
  function step(d) { at = (at + d + ALL.length) % ALL.length; show(); }

  x.addEventListener("click", close);
  prev.addEventListener("click", function () { step(-1); });
  next.addEventListener("click", function () { step(1); });
  lb.addEventListener("click", function (e) { if (e.target === lb || e.target === stage) close(); });
  document.addEventListener("keydown", function (e) {
    if (lb.hidden) return;
    if (e.key === "Escape") close();
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "ArrowRight") step(1);
    else if (e.key === "Tab") {
      var f = [x, prev, next].filter(function (b) { return !b.hidden; });
      var i = f.indexOf(document.activeElement); e.preventDefault();
      f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
    }
  });
  var tx = 0, ty = 0;
  lb.addEventListener("touchstart", function (e) { tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY; }, { passive: true });
  lb.addEventListener("touchend", function (e) {
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
  }, { passive: true });

  /* ── live repo facts ── */
  if (typeof fetch === "function") {
    fetch("https://api.github.com/users/L13V/repos?per_page=100&sort=updated")
      .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error("x")); })
      .then(function (d) {
        d.forEach(function (r) {
          var line = repoLines[r.name]; if (!line) return;
          if (r.stargazers_count > 0) line.appendChild(el("span", null, "★ " + r.stargazers_count));
          var when = r.pushed_at || r.updated_at;
          if (when) line.appendChild(el("span", null, new Date(when).toLocaleDateString("en-US", { month: "short", year: "numeric" })));
        });
      })
      .catch(function () {});
  }
})();
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
  }
}

<script type="module">
/* Live CAD viewer.
 *
 * Lighting is carried over verbatim from the Ramtech-Web CAD viewer, where the
 * exposure was calibrated against SolidWorks' own renders rather than chosen by
 * eye. Don't nudge these by feel:
 *
 *   exposure 0.45 over a RoomEnvironment studio IBL with neutral tone mapping
 *   base colours scaled 0.82 on load, because powder-coated parts export as
 *   pure 1.0 white and otherwise clip to one indistinguishable blob
 */
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js";

const VIEWER_EXPOSURE = 0.45;
const BASE_COLOR_SCALE = 0.82;
const CLEAR_TRANSPARENCY = 0.8;   // SolidWorks transparency for clear polycarbonate
const DRACO_PATH = "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/libs/draco/";

window.__mount3D = function (host, url, opts) {
  opts = opts || {};
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.toneMappingExposure = 1;      // dropped to CAD_EXPOSURE below, if warranted
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  const canvas = renderer.domElement;
  canvas.style.width = "100%";
  canvas.style.height = "100%";
  host.appendChild(canvas);

  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  // how much the neutral studio light fills the model in; lowering it keeps
  // the model's own lights doing the work and lets the shadows stay dark
  if (typeof opts.env === "number") scene.environmentIntensity = opts.env;

  const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 1000);
  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.autoRotateSpeed = 0.8;
  controls.autoRotate = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  // once someone takes hold of it, the idle spin does not come back and drag
  // the view out from under whatever they had lined up
  controls.addEventListener("start", () => { controls.autoRotate = false; });

  // Same pipeline as the Ramtech-Web viewer: render into an HDR float buffer
  // and let OutputPass do the tone mapping, rather than tone mapping in the
  // material shaders on a direct render. (Its OutlinePass is for part picking,
  // which this page has no use for, and is a pass-through when nothing is
  // selected.)
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  // Screen-space AO on top of the baked per-vertex AO: the baked term can only
  // shade at vertices, so large flat faces get none without this.
  const gtao = opts.ao !== false ? new GTAOPass(scene, camera, 1, 1) : null;
  if (gtao) composer.addPass(gtao);
  composer.addPass(new OutputPass());

  const resize = () => {
    const w = host.clientWidth || 1, h = host.clientHeight || 1;
    renderer.setSize(w, h, false);
    composer.setSize(w, h);
    if (gtao) gtao.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  };
  resize();
  const ro = new ResizeObserver(resize);
  ro.observe(host);

  let raf = 0, disposed = false, root = null;

  const draco = new DRACOLoader().setDecoderPath(DRACO_PATH);
  new GLTFLoader().setDRACOLoader(draco).setMeshoptDecoder(MeshoptDecoder).load(
    url,
    (gltf) => {
      if (disposed) return;
      root = gltf.scene;

      // The Ramtech-Web treatment, applied to every model exactly as that
      // viewer applies it: exposure 0.45 and base colours scaled 0.82.
      renderer.toneMappingExposure =
        typeof opts.exposure === "number" ? opts.exposure : VIEWER_EXPOSURE;

      const seen = new Set();
      root.traverse((o) => {
        if (!o.isMesh) return;
        for (const mat of (Array.isArray(o.material) ? o.material : [o.material])) {
          if (!mat || seen.has(mat)) continue;
          seen.add(mat);
          if (mat.color) mat.color.multiplyScalar(BASE_COLOR_SCALE);
          // Reduce authored materials to what Ramtech-Web's converter emits
          // (matte, non-metallic, roughness 0.8) — the 0.45 exposure was
          // calibrated against that, and near-mirror finishes fight the IBL.
          mat.metalness = 0;
          mat.roughness = 0.8;
          mat.metalnessMap = mat.roughnessMap = mat.normalMap = null;
          if (mat.isMeshPhysicalMaterial) {
            // The converter writes clear parts as alpha-blended colour
            // (alpha = 1 - SolidWorks transparency), not physical transmission,
            // which renders frosted grey at roughness 0.8.
            if (mat.transmission > 0) {
              mat.opacity = 1 - CLEAR_TRANSPARENCY * mat.transmission;
              mat.transmission = 0;
              mat.transparent = true;
              mat.depthWrite = false;
              mat.side = THREE.DoubleSide;
            }
            mat.sheen = 0; mat.clearcoat = 0; mat.specularIntensity = 1;
          }
          mat.needsUpdate = true;
        }
      });
      // Conversions carry no lights; authored exports add their own on top of the studio IBL.
      const lights = [];
      root.traverse((o) => { if (o.isLight) lights.push(o); });
      lights.forEach((l) => l.removeFromParent());
      scene.add(root);

      // frame the whole assembly from its bounding sphere
      const sphere = new THREE.Box3().setFromObject(root).getBoundingSphere(new THREE.Sphere());
      const dist = sphere.radius / Math.sin((camera.fov * Math.PI) / 360);
      controls.target.copy(sphere.center);
      // 1.05 rather than 1.15: framing is bounding-sphere based, so the model
      // can never clip as it spins — the extra margin only made it look small
      camera.position.copy(sphere.center).add(
        new THREE.Vector3(0.55, 0.42, 0.72).normalize().multiplyScalar(dist * 1.05));
      camera.near = Math.max(dist / 1000, 1e-4);
      camera.far = dist * 12;
      camera.updateProjectionMatrix();
      controls.update();

      // AO radius has to follow the model's scale, so it is set once the
      // bounding sphere is known rather than guessed at a world size
      if (gtao) {
        gtao.updateGtaoMaterial({
          radius: Math.max(sphere.radius * 0.135, 0.02),
          distanceExponent: 1,
          thickness: Math.max(sphere.radius * 0.135, 0.02),
          // matched by eye to the Ramtech-Web display render of the same robot
          scale: 1.6,
          samples: 16
        });
      }

      host.classList.add("ready");
      const tick = () => { controls.update(); composer.render(); raf = requestAnimationFrame(tick); };
      raf = requestAnimationFrame(tick);
    },
    undefined,
    () => {
      if (disposed) return;
      host.classList.add("failed");
      const s = host.querySelector(".model-load span");
      if (s) s.textContent = "3D unavailable";
    }
  );

  return {
    dispose() {
      if (disposed) return;
      disposed = true;
      cancelAnimationFrame(raf);
      ro.disconnect();
      controls.dispose();
      if (root) {
        root.traverse((o) => {
          if (!o.isMesh) return;
          o.geometry?.dispose();
          for (const m of (Array.isArray(o.material) ? o.material : [o.material])) m?.dispose();
        });
      }
      scene.environment?.dispose();
      pmrem.dispose();
      draco.dispose();
      composer.dispose();
      renderer.dispose();
      canvas.remove();
    }
  };
};

document.dispatchEvent(new Event("three-ready"));
</script>
</body>
</html>
