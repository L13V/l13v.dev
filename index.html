<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liev Dorfman</title>
<meta name="description" content="Robotics software and infrastructure. FRC Team 59 (RAMTECH) robot code, a Spotify TV dashboard that ships as a bootable Linux image, drone swarms, and a self-hosted homelab.">
<meta name="theme-color" content="#080b11">
<meta property="og:type" content="website">
<meta property="og:url" content="https://l13v.dev">
<meta property="og:title" content="Liev Dorfman — robotics software &amp; infrastructure">
<meta property="og:description" content="FRC 59 robot code, a Spotify TV dashboard that ships as a bootable Linux image, drone swarms, and a self-hosted homelab.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2032%2032%22%3E%3Crect%20width=%2232%22%20height=%2232%22%20rx=%227%22%20fill=%22%23080b11%22/%3E%3Ctext%20x=%2216%22%20y=%2222%22%20font-family=%22monospace%22%20font-size=%2216%22%20font-weight=%22700%22%20fill=%22%234d8cff%22%20text-anchor=%22middle%22%3EL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Technical structure, turned up: dark ground, a per-project accent drawn from
   one harmonious set, and motion that points at things instead of decorating. */
:root{
  --bg:#080b11; --bg-2:#0e131c; --bg-3:#151c28; --bg-4:#1d2534;
  --fg:#eaeff7; --fg-2:#9aa7bd; --fg-3:#6b7793;
  --line:rgba(234,239,247,.12); --line-2:rgba(234,239,247,.22);

  --brand:#4d8cff; --brand-2:#22d3ee;
  --grad:linear-gradient(100deg,#4d8cff,#22d3ee);

  /* project accents — one set, so six colours still read as a family */
  --a-red:#ff3d57; --a-cyan:#22d3ee; --a-lime:#a3e635;
  --a-violet:#a78bfa; --a-amber:#fbbf24; --a-blue:#60a5fa;

  --pa:var(--brand);          /* current project accent, set per section */
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gut:clamp(1.15rem,4vw,3rem);
  --r:7px;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{height:100%; scroll-behavior:smooth; scroll-padding-top:84px}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--fg);
  font-family:var(--sans); font-size:1.02rem; line-height:1.62;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  background-image:radial-gradient(rgba(234,239,247,.045) 1px, transparent 1px);
  background-size:30px 30px; background-position:-1px -1px;
}
img,video{max-width:100%; display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand-2); outline-offset:3px; border-radius:3px}
::selection{background:var(--brand); color:#fff}
.wrap{max-width:1300px; margin:0 auto; padding-inline:var(--gut)}
.mono{font-family:var(--mono)}
.lbl{font-family:var(--mono); font-size:.64rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--fg-3)}

/* ── scroll progress ─────────────────────────── */
#bar{position:fixed; top:0; left:0; height:2px; width:0; z-index:400; background:var(--grad); box-shadow:0 0 12px rgba(77,140,255,.7)}

/* ── header ──────────────────────────────────── */
/* Over the hero there is no bar: just the nav links floating on the gradient.
   Once the hero has scrolled away the bar (backdrop, rule, name, role) fades
   in behind them. */
header{position:fixed; top:0; left:0; right:0; z-index:300; border-bottom:1px solid transparent; transition:border-color .4s ease}
header::before{
  content:""; position:absolute; inset:0; z-index:-1; opacity:0; transition:opacity .4s ease;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(14px) saturate(140%); -webkit-backdrop-filter:blur(14px) saturate(140%);
}
header.bar{border-bottom-color:var(--line)}
header.bar::before{opacity:1}
.hd{display:flex; align-items:center; gap:.4rem 1rem; min-height:60px; flex-wrap:wrap}
.hd-lead,.hd-role{opacity:0; visibility:hidden; transform:translateY(-6px); transition:opacity .4s ease, transform .4s ease, visibility 0s .4s}
header.bar .hd-lead,header.bar .hd-role{opacity:1; visibility:visible; transform:none; transition:opacity .4s ease, transform .4s ease}
.hd-lead{display:flex; align-items:center; gap:.6rem; min-width:0}
.hd-name{font-weight:700; letter-spacing:-.02em; font-size:.98rem; margin:0; white-space:nowrap}
.hd-name em{font-style:normal; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.dot{width:7px; height:7px; border-radius:50%; background:var(--a-lime); box-shadow:0 0 0 0 rgba(163,230,53,.6); animation:ping 2.4s ease-out infinite; flex:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(163,230,53,.55)}70%{box-shadow:0 0 0 9px rgba(163,230,53,0)}100%{box-shadow:0 0 0 0 rgba(163,230,53,0)}}
.hd-role{font-family:var(--mono); font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--fg-3); padding-left:1rem; border-left:1px solid var(--line)}
.hd nav{margin-left:auto; display:flex; gap:1.4rem; flex-wrap:wrap}
.hd nav a{font-family:var(--mono); font-size:.68rem; letter-spacing:.11em; text-transform:uppercase; color:var(--fg-2); text-decoration:none; position:relative; padding-block:.3rem}
.hd nav a::after{content:""; position:absolute; left:0; right:100%; bottom:0; height:1.5px; background:var(--grad); transition:right .32s cubic-bezier(.2,.7,.2,1)}
.hd nav a:hover{color:var(--fg)}
.hd nav a:hover::after{right:0}

/* ── hero ────────────────────────────────────── */
/* the header floats over the hero, so clear its 60px */
.hero{position:relative; padding-block:calc(60px + clamp(1.6rem,3.5vw,2.8rem)) clamp(1.4rem,3.5vw,2.4rem); overflow:hidden}
.glow{
  position:absolute; inset:-30% -15% auto -15%; height:700px; z-index:0; pointer-events:none;
  background:
    radial-gradient(42% 46% at 22% 42%, rgba(77,140,255,.28), transparent 72%),
    radial-gradient(38% 42% at 72% 26%, rgba(255,61,87,.20), transparent 72%),
    radial-gradient(34% 40% at 52% 68%, rgba(34,211,238,.16), transparent 72%);
  filter:blur(26px); animation:drift 26s ease-in-out infinite alternate;
}
@keyframes drift{from{transform:translate3d(-2%,0,0) scale(1)}to{transform:translate3d(3%,-3%,0) scale(1.1)}}
/* must exclude .glow — it is absolutely positioned and this would reset it */
.hero > *:not(.glow){position:relative; z-index:1}
.eyebrow{display:inline-flex; align-items:center; gap:.65rem; margin:0 0 1.5rem; padding:.42rem .8rem; border:1px solid var(--line-2); border-radius:100px; background:rgba(14,19,28,.6)}
.eyebrow b{font-family:var(--mono); font-size:.64rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--fg-2)}
h1{
  font-weight:800; font-size:clamp(2.5rem,8.6vw,6.1rem); line-height:.92; letter-spacing:-.045em;
  margin:0 0 1.15rem; text-transform:uppercase; text-wrap:balance;
}
h1 em{font-style:normal; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.hero-cols{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:clamp(1.4rem,4vw,3.5rem); align-items:start}
.lede{font-size:clamp(1.05rem,1.9vw,1.38rem); line-height:1.45; letter-spacing:-.015em; font-weight:500; margin:0; max-width:32ch}
.lede em{font-style:normal; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.sub{font-size:1rem; color:var(--fg-2); margin:0; max-width:50ch}
.cta{display:flex; gap:.7rem; flex-wrap:wrap; margin-top:2.1rem}
.btn{
  font-family:var(--mono); font-size:.7rem; font-weight:600; letter-spacing:.13em; text-transform:uppercase;
  text-decoration:none; padding:.78rem 1.25rem; border-radius:var(--r); border:1px solid var(--line-2);
  color:var(--fg); display:inline-flex; align-items:center; gap:.5rem; position:relative; overflow:hidden;
  transition:transform .2s, border-color .2s, box-shadow .2s, color .2s;
}
.btn:hover{transform:translateY(-2px); border-color:var(--brand); box-shadow:0 8px 28px -12px rgba(77,140,255,.6)}
.btn-1{background:var(--grad); border-color:transparent; color:#06121f; font-weight:700}
.btn-1:hover{box-shadow:0 10px 32px -10px rgba(34,211,238,.65)}

/* ── plates ──────────────────────────────────── */
.plates{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(.7rem,1.8vw,1.1rem)}
.plates > :first-child{grid-column:1 / -1}
/* an even count would leave the last one alone in half a row */
.plates > :last-child:nth-child(even){grid-column:1 / -1}
.plates.single{grid-template-columns:1fr}
figure{margin:0; min-width:0}
.frame{
  position:relative; width:100%; padding:0; display:block; overflow:hidden;
  border:1px solid var(--line); border-radius:var(--r); background:var(--bg-2);
  aspect-ratio:16/10; transition:border-color .25s, box-shadow .25s, transform .25s;
}
.hero-plate .frame{aspect-ratio:21/9}
button.frame{cursor:zoom-in}
button.frame:hover{border-color:var(--pa); transform:translateY(-3px); box-shadow:0 16px 40px -20px color-mix(in srgb, var(--pa) 70%, transparent)}
.frame img,.frame video{width:100%; height:100%; object-fit:cover; transition:transform .5s cubic-bezier(.2,.6,.2,1)}
button.frame:hover img,button.frame:hover video{transform:scale(1.04)}
.frame img.contain{object-fit:contain; background:var(--bg-3); padding:10px}
/* sweep */
button.frame::after{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:0;
  background:linear-gradient(105deg, transparent 38%, color-mix(in srgb, var(--pa) 26%, transparent) 50%, transparent 62%);
  transform:translateX(-70%); transition:opacity .2s;
}
button.frame:hover::after{opacity:1; animation:sweep .75s ease-out}
@keyframes sweep{to{transform:translateX(70%)}}
/* ── live 3D plate ───────────────────────────── */
.plate-model .frame{aspect-ratio:4/3; cursor:grab}
.plate-model .frame:active{cursor:grabbing}
.frame.model canvas{position:relative; z-index:1; display:block}
.model-load{
  position:absolute; inset:0; z-index:2; display:grid; place-items:center;
  background-size:cover; background-position:center;
  transition:opacity .55s ease; opacity:1;
}
.model-load::before{content:""; position:absolute; inset:0; background:rgba(8,11,17,.72)}
.model-load span{
  position:relative; font-family:var(--mono); font-size:.64rem; letter-spacing:.16em;
  text-transform:uppercase; color:var(--fg-2); background:rgba(8,11,17,.8);
  border:1px solid var(--line); border-radius:100px; padding:.45rem .85rem;
  display:flex; align-items:center; gap:.5rem;
}
.model-load span::before{
  content:""; width:9px; height:9px; border-radius:50%; border:1.5px solid var(--pa);
  border-top-color:transparent; animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.frame.model.ready .model-load{opacity:0; pointer-events:none}
.frame.model .model-tag{transition:opacity .4s}
.frame.model:not(.ready) .model-tag{opacity:0}
.frame.model.failed .model-load span::before{display:none}
.model-tag,.model-exp{
  position:absolute; bottom:10px; z-index:3; font-family:var(--mono); font-size:.58rem;
  letter-spacing:.14em; text-transform:uppercase; border-radius:100px;
  background:rgba(8,11,17,.8); border:1px solid var(--line-2); color:var(--fg-2);
  padding:.34rem .7rem; backdrop-filter:blur(6px);
}
.model-tag{left:10px; pointer-events:none; display:flex; align-items:center; gap:.45rem}
.model-tag i{width:5px; height:5px; border-radius:50%; background:var(--pa); flex:none}
.model-exp{right:10px; cursor:pointer; transition:color .2s, border-color .2s}
.model-exp:hover{color:var(--pa); border-color:var(--pa)}
.model-reset{
  position:absolute; top:10px; right:10px; z-index:3; display:inline-flex; align-items:center; gap:.4rem;
  font-family:var(--mono); font-size:.58rem; letter-spacing:.14em; text-transform:uppercase; cursor:pointer;
  border-radius:100px; background:rgba(8,11,17,.8); border:1px solid var(--line-2); color:var(--fg-2);
  padding:.34rem .7rem .34rem .55rem; backdrop-filter:blur(6px);
  opacity:0; transform:translateY(-4px); pointer-events:none; transition:opacity .25s, transform .25s, color .2s, border-color .2s;
}
.model-reset svg{width:11px; height:11px}
.model-reset.on{opacity:1; transform:none; pointer-events:auto}
.model-reset:hover{color:var(--pa); border-color:var(--pa)}
.model-load.has-poster{place-items:end start; padding:10px}
.model-load.has-poster::before{background:linear-gradient(180deg, transparent 60%, rgba(8,11,17,.5))}
.lb-model{width:min(100%,1150px); aspect-ratio:16/10; max-height:100%; position:relative; border-radius:var(--r); overflow:hidden; background:#0b0e14; cursor:grab}
.lb-model:active{cursor:grabbing}

figcaption{font-family:var(--mono); font-size:.68rem; line-height:1.5; color:var(--fg-2); padding-top:.6rem; display:flex; gap:.6rem; align-items:baseline}
.fig{color:var(--pa); font-weight:600; letter-spacing:.07em; white-space:nowrap}
.play{position:absolute; inset:0; display:grid; place-items:center; pointer-events:none}
.play i{width:56px; height:56px; border-radius:50%; background:color-mix(in srgb, var(--pa) 82%, transparent); display:grid; place-items:center; box-shadow:0 8px 30px -8px color-mix(in srgb, var(--pa) 80%, transparent)}
.play i::after{content:""; border-style:solid; border-width:9px 0 9px 15px; border-color:transparent transparent transparent #06121f; margin-left:4px}

/* ── project sheets ──────────────────────────── */
.sheet{padding-block:clamp(2.4rem,6vw,4rem); border-top:1px solid var(--line); position:relative}
.sheet::before{content:""; position:absolute; top:-1px; left:0; width:84px; height:2px; background:var(--pa); box-shadow:0 0 14px color-mix(in srgb, var(--pa) 75%, transparent)}
.sh-head{display:flex; gap:.85rem; align-items:center; flex-wrap:wrap; margin-bottom:1.1rem}
.sh-no{font-family:var(--mono); font-size:.74rem; font-weight:600; letter-spacing:.1em; color:var(--pa)}
.sh-sep{color:var(--line-2)}
.chip{
  margin-left:auto; display:inline-flex; align-items:center; gap:.5rem;
  font-family:var(--mono); font-size:.62rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
  padding:.35rem .7rem; border-radius:100px;
  color:var(--pa); border:1px solid color-mix(in srgb, var(--pa) 45%, transparent);
  background:color-mix(in srgb, var(--pa) 11%, transparent);
}
.chip i{width:6px; height:6px; border-radius:50%; background:var(--pa); flex:none}
.chip.live i{animation:ping2 2s ease-out infinite}
@keyframes ping2{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--pa) 60%, transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
h2{font-weight:700; font-size:clamp(1.5rem,3.4vw,2.3rem); line-height:1.08; letter-spacing:-.03em; margin:0 0 1.6rem; max-width:24ch; text-wrap:balance}
.sh-title{display:flex; align-items:center; justify-content:space-between; gap:1.5rem; margin:0 0 1.6rem}
.sh-title h2{margin:0}
.sh-logo{height:clamp(2.6rem,6vw,4.2rem); width:auto; flex:none}
@media (max-width:560px){.sh-title{flex-direction:column-reverse; align-items:flex-start; gap:1rem}}
/* Media sits BESIDE the prose, not under it — otherwise a project's height is
   text + images stacked and nothing fits on one screen. */
.sh-body{display:grid; grid-template-columns:minmax(0,1.08fr) minmax(0,1fr); gap:clamp(1.4rem,3vw,2.8rem); align-items:start}
.sh-body.no-media{grid-template-columns:minmax(0,1fr)}
.sh-media,.sh-text{min-width:0}
.summary{font-size:1.05rem; line-height:1.6; margin:0 0 1.5rem; max-width:54ch; letter-spacing:-.008em}
ol.notes{list-style:none; counter-reset:n; margin:0 0 1.6rem; padding:0; display:flex; flex-direction:column; gap:.95rem; max-width:58ch}
ol.notes li{counter-increment:n; display:grid; grid-template-columns:2.1rem 1fr; font-size:.95rem; line-height:1.6; color:var(--fg-2)}
ol.notes li::before{
  content:counter(n,decimal-leading-zero); font-family:var(--mono); font-size:.68rem; font-weight:600;
  color:var(--pa); padding-top:.3rem; letter-spacing:.06em;
}
.sh-links{display:flex; gap:.6rem; flex-wrap:wrap}
.plink{
  font-family:var(--mono); font-size:.66rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase;
  text-decoration:none; padding:.5rem .85rem; border-radius:var(--r);
  border:1px solid var(--line-2); color:var(--fg-2); transition:color .2s, border-color .2s, background-color .2s;
}
.plink:hover{color:var(--pa); border-color:var(--pa); background:color-mix(in srgb, var(--pa) 10%, transparent)}

.spec-block{margin:0 0 1.5rem}
.spec-block > .lbl{display:block; padding-bottom:.6rem; border-bottom:1px solid var(--line); margin-bottom:.2rem}
dl.spec{margin:0}
.srow{display:flex; align-items:baseline; gap:.55rem; padding:.5rem .55rem; margin-inline:-.55rem; border-radius:5px; transition:background-color .18s}
.srow:hover{background:color-mix(in srgb, var(--pa) 9%, transparent)}
.srow dt{font-family:var(--mono); font-size:.7rem; letter-spacing:.05em; text-transform:uppercase; color:var(--fg-3); white-space:nowrap}
.srow .ldr{flex:1 1 auto; min-width:.8rem; border-bottom:1px dotted var(--line-2); transform:translateY(-.22em)}
.srow dd{margin:0; font-family:var(--mono); font-size:.75rem; color:var(--fg); text-align:right; min-width:0}
.repo{margin-top:1rem; padding-top:.8rem; border-top:1px solid var(--line); font-family:var(--mono); font-size:.66rem; color:var(--fg-3); display:flex; gap:.9rem; flex-wrap:wrap}

/* ── source viewer ───────────────────────────── */
.sh-side{min-width:0}
/* the trigger: one quiet card in the project's links row */
.code-open{
  all:unset; box-sizing:border-box; cursor:pointer; display:flex; align-items:center; gap:.85rem;
  width:100%; padding:.8rem 1rem .8rem .8rem; border-radius:calc(var(--r) + 2px);
  border:1px solid color-mix(in srgb, var(--pa) 38%, var(--line)); position:relative; overflow:hidden;
  background:linear-gradient(100deg, color-mix(in srgb, var(--pa) 12%, transparent), transparent 70%);
  transition:border-color .25s, transform .25s, box-shadow .25s;
}
.code-open:hover{border-color:var(--pa); transform:translateY(-2px); box-shadow:0 14px 34px -18px color-mix(in srgb, var(--pa) 75%, transparent)}
.code-open:focus-visible{outline:2px solid var(--brand-2); outline-offset:3px}
.code-open .ico{
  width:2.4rem; height:2.4rem; flex:none; border-radius:7px; display:grid; place-items:center;
  background:color-mix(in srgb, var(--pa) 18%, var(--bg-2)); color:var(--pa);
  font-family:var(--mono); font-size:.8rem; font-weight:600; letter-spacing:-.04em;
}
.code-open .txt{display:flex; flex-direction:column; min-width:0}
.code-open .txt b{font-size:.95rem; font-weight:600; letter-spacing:-.01em; color:var(--fg)}
.code-open .txt small{font-family:var(--mono); font-size:.62rem; letter-spacing:.06em; line-height:1.45; color:var(--fg-3)}
.code-open .arr{margin-left:auto; font-family:var(--mono); color:var(--pa); transition:transform .25s}
.code-open:hover .arr{transform:translateX(3px)}
/* the action card leads with a frame from the match */
.code-open .ico.thumb{width:3.6rem; height:2.4rem; background-size:cover; background-position:center; position:relative; overflow:hidden}
.code-open .ico.thumb::before{content:""; position:absolute; inset:0; background:rgba(8,11,17,.35)}
.code-open .ico.thumb::after{content:""; position:relative; border-style:solid; border-width:6px 0 6px 10px; border-color:transparent transparent transparent #fff; margin-left:2px}
.sh-links:has(.code-open + .code-open){display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.7rem}
@media (max-width:560px){.sh-links:has(.code-open + .code-open){grid-template-columns:1fr}}

/* the viewer opens over the page */
.cv{position:fixed; inset:0; z-index:500; display:grid; place-items:center; padding:clamp(.5rem,3vw,2.5rem); background:rgba(5,7,11,.78); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); animation:cv-fade .25s ease}
.cv[hidden]{display:none!important}
@keyframes cv-fade{from{opacity:0}}
.cv .code{width:min(100%,1180px); height:min(100%,760px); display:flex; flex-direction:column; animation:cv-rise .35s cubic-bezier(.2,.7,.2,1)}
@keyframes cv-rise{from{opacity:0; transform:translateY(14px) scale(.985)}}
.cv .code-body{flex:1 1 auto; min-height:0}
.cv .code-pane{min-height:0}
.cv .code-scroll{height:auto; flex:1 1 auto; min-height:0}
.code-x{all:unset; cursor:pointer; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; border:1px solid var(--line-2); color:var(--fg-2); transition:color .2s, border-color .2s}
.code-x:hover{color:var(--fg); border-color:var(--pa)}
.code-x:focus-visible{outline:2px solid var(--brand-2); outline-offset:2px}
.code-fig{display:grid; place-items:center; padding:1.2rem; min-height:100%}
.code-fig img{max-width:100%; height:auto; border-radius:6px}
.code{
  border:1px solid var(--line); border-radius:calc(var(--r) + 3px);
  background:linear-gradient(180deg, var(--bg-2), color-mix(in srgb, var(--bg) 70%, var(--bg-2)));
  overflow:hidden; position:relative;
  box-shadow:0 30px 70px -40px rgba(0,0,0,.9), inset 0 1px 0 rgba(234,239,247,.04);
}
.code::before{content:""; position:absolute; top:0; left:0; right:0; height:1px; background:linear-gradient(90deg, var(--pa), transparent 55%)}
.code-hd{display:flex; align-items:center; gap:1rem; flex-wrap:wrap; padding:.85rem 1rem .85rem 1.15rem; border-bottom:1px solid var(--line)}
.code-id{display:flex; align-items:center; gap:.7rem; min-width:0; flex-wrap:wrap}
.code-id svg{width:15px; height:15px; color:var(--pa); flex:none}
.code-repo{font-family:var(--mono); font-size:.8rem; font-weight:600; color:var(--fg); text-decoration:none; letter-spacing:-.01em}
.code-repo span{color:var(--fg-3); font-weight:400}
.code-repo:hover{color:var(--pa)}
.code-ref{font-family:var(--mono); font-size:.64rem; letter-spacing:.06em; color:var(--fg-3); text-decoration:none; padding:.2rem .5rem; border:1px solid var(--line); border-radius:100px; transition:color .2s, border-color .2s}
.code-ref:hover{color:var(--fg); border-color:var(--line-2)}
.code-acts{margin-left:auto; display:flex; gap:.5rem; flex-wrap:wrap}
.code-act{
  font-family:var(--mono); font-size:.62rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase;
  text-decoration:none; display:inline-flex; align-items:center; gap:.45rem;
  padding:.5rem .8rem; border-radius:var(--r); border:1px solid var(--line-2); color:var(--fg-2);
  transition:color .2s, border-color .2s, background-color .2s, transform .2s, box-shadow .2s;
}
.code-act svg{width:12px; height:12px; flex:none}
.code-act:hover{color:var(--fg); border-color:var(--pa); transform:translateY(-1px)}
.code-act.pri{color:#0b0e14; background:var(--pa); border-color:transparent}
.code-act.pri:hover{color:#0b0e14; box-shadow:0 8px 24px -10px color-mix(in srgb, var(--pa) 80%, transparent)}

.code-body{display:grid; grid-template-columns:minmax(0,17.5rem) minmax(0,1fr)}
.code-rail{border-right:1px solid var(--line); display:flex; flex-direction:column; min-width:0}
.code-tabs{display:flex; flex-direction:column; padding:.5rem}
.code-tab{
  all:unset; box-sizing:border-box; cursor:pointer; display:grid; grid-template-columns:1.8rem 1fr; row-gap:.1rem;
  padding:.62rem .7rem; border-radius:6px; position:relative; transition:background-color .2s;
}
.code-tab:hover{background:rgba(234,239,247,.035)}
.code-tab:focus-visible{outline:2px solid var(--brand-2); outline-offset:-2px}
.code-tab b{grid-row:span 2; font-family:var(--mono); font-size:.66rem; font-weight:600; color:var(--fg-3); padding-top:.18rem; transition:color .2s}
.code-tab .tt{font-size:.9rem; font-weight:600; color:var(--fg-2); letter-spacing:-.01em; transition:color .2s}
.code-tab .loc{font-family:var(--mono); font-size:.62rem; color:var(--fg-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.code-tab[aria-selected="true"]{background:color-mix(in srgb, var(--pa) 9%, transparent)}
.code-tab[aria-selected="true"]::before{content:""; position:absolute; left:0; top:.6rem; bottom:.6rem; width:2px; border-radius:2px; background:var(--pa); box-shadow:0 0 10px var(--pa)}
.code-tab[aria-selected="true"] b{color:var(--pa)}
.code-tab[aria-selected="true"] .tt{color:var(--fg)}
.code-note{margin:auto 0 0; padding:1rem 1.15rem 1.15rem; border-top:1px solid var(--line); font-size:.86rem; line-height:1.6; color:var(--fg-2)}
.code-note .lbl{display:block; margin-bottom:.45rem; color:var(--pa)}

.code-pane{display:flex; flex-direction:column; min-width:0; background:rgba(5,7,11,.35)}
.code-bar{display:flex; align-items:center; gap:.8rem; padding:.6rem 1rem; border-bottom:1px solid var(--line); font-family:var(--mono); font-size:.68rem; color:var(--fg-3); min-width:0}
.code-path{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:rtl; text-align:left; min-width:0}
.code-path bdi{direction:ltr}
.code-path b{color:var(--fg); font-weight:500}
.code-gh{margin-left:auto; flex:none; color:var(--fg-2); text-decoration:none; display:inline-flex; gap:.35rem; align-items:center; white-space:nowrap}
.code-gh svg{width:11px; height:11px}
.code-gh:hover{color:var(--pa)}
.code-gh[hidden]{display:none}
.code-scroll{overflow:auto; overscroll-behavior:contain; position:relative; scrollbar-width:thin; scrollbar-color:var(--bg-4) transparent}
.code-lines{padding:.8rem 0 1.4rem; font-family:var(--mono); font-size:.76rem; line-height:1.72; tab-size:4; -moz-tab-size:4; min-width:max-content}
.ln{display:flex; padding-right:1.5rem; animation:ln-in .38s cubic-bezier(.2,.7,.2,1) backwards}
.ln:hover{background:rgba(234,239,247,.035)}
.ln:hover .ln-no{color:var(--pa)}
@keyframes ln-in{from{opacity:0; transform:translateX(-6px)}}
.ln-no{flex:none; width:3.6rem; padding-right:1.1rem; text-align:right; color:#3f4a5f; text-decoration:none; user-select:none; transition:color .15s}
.ln-tx{white-space:pre; color:#c9d3e3}
.code-msg{display:grid; place-items:center; height:100%; padding:2rem; text-align:center; font-family:var(--mono); font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-3)}
.code-msg a{color:var(--pa)}
/* syntax — drawn from the page's accent family */
.t-k{color:#c792ea}
.t-t{color:#67d8ef}
.t-f{color:#82aaff}
.t-s{color:#b5e07a}
.t-n{color:#fbbf24}
.t-a{color:#ff7a8a}
.t-c{color:#5d6a82; font-style:italic}

@media (max-width:860px){
  .cv{padding:0}
  .cv .code{height:100%; border-radius:0; border:0}
  .code-hd{padding:.7rem .8rem}
  .code-note{display:none}
  .code-body{grid-template-columns:minmax(0,1fr)}
  .code-rail{border-right:0; border-bottom:1px solid var(--line)}
  .code-tabs{flex-direction:row; overflow-x:auto; scrollbar-width:none; gap:.25rem}
  .code-tabs::-webkit-scrollbar{display:none}
  .code-tab{flex:none; grid-template-columns:1.5rem auto}
  .code-tab .loc{display:none}
  .code-tab b{grid-row:auto}
  .code-tab[aria-selected="true"]::before{left:.7rem; right:.7rem; top:auto; bottom:0; width:auto; height:2px}
  .code-note{margin:0}
  .code-act:not(.pri){display:none}
}

/* ── tail ────────────────────────────────────── */
.cap{margin:0; border-top:1px solid var(--line)}
.cap > div{display:grid; grid-template-columns:minmax(0,170px) minmax(0,1fr); gap:1.4rem; padding:1rem .6rem; margin-inline:-.6rem; border-bottom:1px solid var(--line); align-items:baseline; border-radius:5px; transition:background-color .2s}
.cap > div:hover{background:rgba(234,239,247,.035)}
.cap dt{font-family:var(--mono); font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:600}
.cap dd{margin:0; font-size:.94rem; color:var(--fg-2); line-height:1.6}
.bench{display:grid; grid-template-columns:repeat(auto-fit,minmax(245px,1fr)); gap:1rem; margin-top:2rem}
.bcard{border:1px solid var(--line); border-radius:var(--r); padding:1.25rem; background:var(--bg-2); transition:border-color .25s, transform .25s}
.bcard:nth-child(1){--pa:var(--a-cyan)} .bcard:nth-child(2){--pa:var(--a-violet)} .bcard:nth-child(3){--pa:var(--a-amber)}
.bcard:hover{border-color:var(--pa); transform:translateY(-3px)}
.bcard h3{font-family:var(--mono); font-size:.7rem; letter-spacing:.13em; text-transform:uppercase; color:var(--pa); margin:0 0 .7rem}
.bcard p{margin:0; font-size:.92rem; line-height:1.65; color:var(--fg-2)}

footer{border-top:1px solid var(--line); margin-top:clamp(2rem,5vw,3.5rem)}
.foot{display:flex; gap:1.2rem; flex-wrap:wrap; align-items:center; justify-content:space-between; padding-block:1.8rem calc(1.8rem + env(safe-area-inset-bottom,0px))}
.foot a{font-family:var(--mono); font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; text-decoration:none; color:var(--fg-2)}
.foot a:hover{color:var(--brand-2)}
.foot nav{display:flex; gap:1.2rem; flex-wrap:wrap}

/* ── reveal on scroll (only when JS is on) ──── */
.js [data-rev]{opacity:0; transform:translateY(16px)}
.js [data-rev].in{animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1; transform:none}}
/* hero animates straight away, no observer */
.hz{animation:rise .75s cubic-bezier(.2,.7,.2,1) backwards}

/* ── lightbox ────────────────────────────────── */
.lb{position:fixed; inset:0; z-index:500; display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-rows:auto minmax(0,1fr) auto; background:rgba(5,7,11,.97); backdrop-filter:blur(8px); padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.lb-bar{grid-column:1 / -1}
.lb-stage{grid-column:1; grid-row:2}
.lb-cap{grid-column:1; grid-row:3}
.lb.solo .lb-side{display:none}
/* playlist */
.lb-side{grid-column:2; grid-row:2 / 4; width:clamp(270px,24vw,340px); border-left:1px solid rgba(255,255,255,.1); display:flex; flex-direction:column; min-height:0}
.lb-side-hd{display:flex; align-items:baseline; gap:.6rem; padding:1rem 1.1rem .7rem}
.lb-side-hd .lbl{color:var(--fg-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.lb-side-n{margin-left:auto; font-family:var(--mono); font-size:.62rem; color:var(--fg-3)}
.lb-list{list-style:none; margin:0; padding:0 .6rem 1rem; overflow-y:auto; display:flex; flex-direction:column; gap:.35rem; scrollbar-width:thin; scrollbar-color:var(--bg-4) transparent}
.lb-item{
  all:unset; box-sizing:border-box; cursor:pointer; width:100%; display:grid; grid-template-columns:7.2rem minmax(0,1fr); gap:.75rem; align-items:center;
  padding:.45rem; border-radius:8px; border:1px solid transparent; transition:background-color .2s, border-color .2s;
}
.lb-item:hover{background:rgba(255,255,255,.04)}
.lb-item:focus-visible{outline:2px solid var(--brand-2); outline-offset:-2px}
.lb-item[aria-current="true"]{background:color-mix(in srgb, var(--pa) 12%, transparent); border-color:color-mix(in srgb, var(--pa) 45%, transparent)}
.lb-th{position:relative; aspect-ratio:16/9; border-radius:5px; overflow:hidden; background:var(--bg-3) center/cover no-repeat; border:1px solid rgba(255,255,255,.08)}
.lb-th.contain{background-size:contain; background-color:var(--bg-3)}
.lb-th.vid::after{content:""; position:absolute; left:50%; top:50%; transform:translate(-40%,-50%); border-style:solid; border-width:7px 0 7px 11px; border-color:transparent transparent transparent #fff; filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.lb-th.mdl{display:grid; place-items:center; font-family:var(--mono); font-size:.62rem; font-weight:600; letter-spacing:.12em; color:#fff}
.lb-th.mdl span{background:rgba(8,11,17,.7); padding:.15rem .4rem; border-radius:4px}
.lb-it{display:flex; flex-direction:column; gap:.2rem; min-width:0}
.lb-it .k{font-family:var(--mono); font-size:.58rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--pa)}
.lb-it .c{font-size:.8rem; line-height:1.35; color:var(--fg-2); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.lb-item[aria-current="true"] .c{color:var(--fg)}
.lb-it .st{font-family:var(--mono); font-size:.56rem; letter-spacing:.12em; text-transform:uppercase; color:var(--fg-3)}
.lb-item[aria-current="true"] .st{color:var(--pa)}
@media (max-width:820px){
  .lb{grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr) auto auto}
  .lb-side{grid-column:1; grid-row:4; width:auto; border-left:0; border-top:1px solid rgba(255,255,255,.1)}
  .lb-side-hd{padding:.7rem var(--gut) .4rem}
  .lb-list{flex-direction:row; overflow-x:auto; overflow-y:hidden; padding:0 var(--gut) .9rem}
  .lb-list li{flex:none; width:12.5rem}
  .lb-item{grid-template-columns:1fr}
  .lb-it .c{-webkit-line-clamp:1}
}
.lb[hidden]{display:none!important}
.lb-bar{display:flex; gap:1rem; align-items:center; padding:.95rem var(--gut); border-bottom:1px solid rgba(255,255,255,.1)}
.lb-fig{font-family:var(--mono); font-size:.68rem; font-weight:600; letter-spacing:.14em; color:var(--pa)}
.lb-ct{font-family:var(--mono); font-size:.68rem; letter-spacing:.12em; color:#8e9bb0; margin-left:.2rem}
.lb-btn{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.22); color:#eaeff7; width:38px; height:38px; border-radius:50%; cursor:pointer; display:grid; place-items:center; flex:none; font-size:1rem; transition:background-color .2s, border-color .2s}
.lb-btn:hover{background:color-mix(in srgb, var(--brand) 32%, transparent); border-color:var(--brand)}
.lb-x{margin-left:auto}
.lb-stage{position:relative; display:grid; place-items:center; min-height:0; padding:clamp(.6rem,2vw,1.5rem) clamp(.5rem,5vw,4.5rem)}
.lb-stage img,.lb-stage video,.lb-stage iframe{max-width:100%; max-height:100%; width:auto; height:auto; border-radius:var(--r); background:#000; box-shadow:0 30px 80px -30px rgba(0,0,0,.9)}
.lb-stage iframe{width:min(100%,1080px); aspect-ratio:16/9; height:auto; border:0}
.lb-stage iframe.vert{width:auto; height:min(calc(100vh - 10rem), 820px); max-width:100%; aspect-ratio:9/16}
.lb-nav{position:absolute; top:50%; transform:translateY(-50%)}
.lb-prev{left:clamp(.25rem,1.5vw,1rem)} .lb-next{right:clamp(.25rem,1.5vw,1rem)}
.lb-cap{margin:0; padding:.95rem var(--gut) 1.4rem; font-family:var(--mono); font-size:.76rem; line-height:1.55; color:#9aa7bd; text-align:center}

/* two columns need real room; below this the media goes back above the prose */
@media (max-width:980px){
  .sh-body,.sh-body.no-media{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:880px){
  .hero-cols{grid-template-columns:1fr}
  .hd-role{display:none}
}
@media (max-width:560px){
  .plates{grid-template-columns:1fr}
  .chip{margin-left:0}
  .cap > div{grid-template-columns:1fr; gap:.25rem}
}
</style>
</head>
<body>
<div id="bar"></div>

<header>
  <div class="wrap hd">
    <div class="hd-lead"><span class="dot"></span><span class="hd-name" id="hd-name"></span></div>
    <span class="hd-role" id="hd-role"></span>
    <nav>
      <a href="#work">Work</a>
      <a href="#stack">Stack</a>
      <a href="https://github.com/L13V">GitHub</a>
    </nav>
  </div>
</header>

<main>
  <section class="hero">
    <div class="glow"></div>
    <div class="wrap">
      <p class="eyebrow hz" style="animation-delay:.05s"><span class="dot"></span><b id="eyebrow"></b></p>
      <h1 class="hz" style="animation-delay:.12s" id="h1"></h1>
      <div class="hero-cols">
        <div class="hz" style="animation-delay:.2s">
          <p class="lede" id="lede"></p>
          <div class="cta" id="cta"></div>
        </div>
        <p class="sub hz" id="sub" style="animation-delay:.28s"></p>
      </div>
    </div>
  </section>

  <div class="wrap">
    <div id="sheets"></div>

    <section class="sheet" id="stack" style="--pa:var(--brand-2)" data-rev>
      <div class="sh-head"><span class="sh-no">RIG</span><span class="sh-sep">/</span><span class="lbl">Capability</span></div>
      <h2>What I build with</h2>
      <dl class="cap" id="cap"></dl>
    </section>

    <section class="sheet" style="--pa:var(--a-violet)" data-rev>
      <div class="sh-head"><span class="sh-no">EXT</span><span class="sh-sep">/</span><span class="lbl">Also on the bench</span></div>
      <h2>Outside the main build</h2>
      <div class="bench" id="bench"></div>
    </section>
  </div>
</main>

<footer>
  <div class="wrap foot">
    <span class="lbl">&copy; <span id="yr"></span> Liev Dorfman &middot; l13v.dev</span>
    <nav>
      <a href="https://github.com/L13V">GitHub</a>
      <a href="https://dorfman.net">dorfman.net</a>
    </nav>
  </div>
</footer>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Media viewer">
  <div class="lb-bar">
    <span class="lb-fig" id="lb-fig"></span><span class="lb-ct" id="lb-ct"></span>
    <button class="lb-btn lb-x" id="lb-x" type="button" aria-label="Close">&#10005;</button>
  </div>
  <div class="lb-stage" id="lb-stage">
    <button class="lb-btn lb-nav lb-prev" id="lb-prev" type="button" aria-label="Previous">&#8249;</button>
    <button class="lb-btn lb-nav lb-next" id="lb-next" type="button" aria-label="Next">&#8250;</button>
  </div>
  <p class="lb-cap" id="lb-cap"></p>
  <aside class="lb-side" id="lb-side" aria-label="Project media">
    <div class="lb-side-hd"><span class="lbl" id="lb-side-t"></span><span class="lb-side-n" id="lb-side-n"></span></div>
    <ol class="lb-list" id="lb-list"></ol>
  </aside>
</div>

<script src="projects.js"></script>
<script>
(function () {
  "use strict";
  document.documentElement.classList.add("js");

  var ACCENTS = ["--a-red", "--a-cyan", "--a-lime", "--a-violet", "--a-amber", "--a-blue"];
  function el(t, c, x) { var n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; }
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  /* header + hero */
  document.getElementById("hd-role").textContent = SITE.role;
  document.getElementById("eyebrow").textContent = SITE.team;
  document.getElementById("sub").textContent = SITE.intro2;
  document.getElementById("yr").textContent = String(new Date().getFullYear());

  /* the big heading, surname in the gradient; the bar gets a plain copy */
  var parts = SITE.name.split(" ");
  var given = parts.slice(0, -1).join(" ");
  var surname = parts[parts.length - 1];

  var h1 = document.getElementById("h1");
  h1.appendChild(document.createTextNode(given + " "));
  h1.appendChild(el("em", null, surname));

  var hdName = document.getElementById("hd-name");
  hdName.appendChild(document.createTextNode(given + " "));
  hdName.appendChild(el("em", null, surname));

  /* the opening statement, with one phrase picked out in the gradient */
  var ledeEl = document.getElementById("lede");
  var phrase = SITE.highlight;
  var at = phrase ? SITE.intro.indexOf(phrase) : -1;
  if (at >= 0) {
    ledeEl.appendChild(document.createTextNode(SITE.intro.slice(0, at)));
    ledeEl.appendChild(el("em", null, phrase));
    ledeEl.appendChild(document.createTextNode(SITE.intro.slice(at + phrase.length)));
  } else {
    ledeEl.textContent = SITE.intro;
  }

  var cta = document.getElementById("cta");
  SITE.links.forEach(function (l, i) {
    var a = el("a", "btn" + (i === 0 ? " btn-1" : ""), l.label);
    a.href = l.href; a.rel = "noopener"; cta.appendChild(a);
  });
  var w = el("a", "btn", "See the work"); w.href = "#work"; cta.appendChild(w);

  /* ── media ── */
  /* every project keeps its own media list; the viewer plays through it */
  var MEDIA = {}, CLIPS = {}, TITLES = {}, figNo = 0;
  function reg(slug, entry) { (MEDIA[slug] = MEDIA[slug] || []).push(entry); return entry; }
  function src(slug, f) { return "media/" + slug + "/" + f; }

  function thumb(slug, m) {
    if (m.type === "youtube") { var y = el("img"); y.src = "https://img.youtube.com/vi/" + m.id + "/hqdefault.jpg"; y.alt = m.caption || ""; y.loading = "lazy"; return y; }
    if (m.type === "video") {
      if (m.poster) { var p = el("img"); p.src = src(slug, m.poster); p.alt = m.caption || ""; p.loading = "lazy"; return p; }
      var v = el("video"); v.src = src(slug, m.file); v.preload = "metadata"; v.muted = true; v.playsInline = true; return v;
    }
    var i = el("img"); i.src = src(slug, m.file); i.alt = m.caption || ""; i.loading = "lazy";
    if (/\.svg$/i.test(m.file)) i.className = "contain";
    return i;
  }

  /* three.js arrives as a module, which is deferred — so a mount may be
     requested before it exists. Queue until it announces itself. */
  function mount3D(host, url, opts, onReady) {
    function go() {
      var h = null;
      try { h = window.__mount3D(host, url, opts || {}); } catch (e) { host.classList.add("failed"); }
      if (onReady) onReady(h);
    }
    if (window.__mount3D) { go(); }
    else { document.addEventListener("three-ready", go, { once: true }); }
  }

  /* lighting options travel on the element so a lazy mount can read them back */
  function optsOf(m) {
    var o = {};
    if (typeof m.exposure === "number") o.exposure = m.exposure;
    if (typeof m.env === "number") o.env = m.env;
    if (m.ao === false) o.ao = false;
    if (m.spin === false) o.spin = false;
    return o;
  }

  /* Only build a WebGL context once the plate is actually near the screen. */
  function mountHost(host) {
    if (host.getAttribute("data-mounted")) return;
    host.setAttribute("data-mounted", "1");
    var o = {};
    try { o = JSON.parse(host.getAttribute("data-model-opts") || "{}"); } catch (e) {}

    document.getElementById("lb-side-n").textContent = list.length + (list.length === 1 ? " item" : " items");
    list.forEach(function (f, i) {

      var th = el("span", "lb-th"), m = f.m;

      else if (m.type === "model") { if (m.poster) th.style.backgroundImage = "url('" + src(f.slug, m.poster) + "')"; th.className += " mdl"; th.appendChild(el("span", null, "3D")); }
      else { th.style.backgroundImage = "url('" + urlOf(f) + "')"; if (/\.svg$/i.test(urlOf(f))) th.className += " contain"; }
      var it = el("span", "lb-it");
      it.appendChild(el("span", "k", kindOf(f)));
      it.appendChild(el("span", "c", m.caption || ""));

      it.appendChild(st);
      b.appendChild(th); b.appendChild(it);

  }

  }

  /* YouTube tells us when a video ends only through its player API */
  var ytWait = null;
  function ytApi(cb) {
    if (window.YT && window.YT.Player) return cb();
    if (!ytWait) {
      ytWait = [];

  function show() {

    var f = list[at], m = f.m, n, mountUrl = null, mountOpts = null, token = mountToken;
    lb.style.setProperty("--pa", "var(" + f.accent + ")");
    if (m.type === "model") {
      n = document.createElement("div");
      n.className = "lb-model";
      mountUrl = src(f.slug, m.file);   /* mounted after it is in the DOM */
      mountOpts = optsOf(m);
    } else if (m.type === "youtube") {
      n = document.createElement("iframe");
      n.src = "https://www.youtube-nocookie.com/embed/" + m.id + "?autoplay=1&rel=0&playsinline=1&enablejsapi=1&origin=" + encodeURIComponent(location.origin);
      n.id = "lb-yt-" + token;
      n.allow = "autoplay; encrypted-media; picture-in-picture";
      n.setAttribute("allowfullscreen", ""); n.title = m.caption || "Video";

      n.controls = true; n.autoplay = true; n.playsInline = true;

  if (typeof fetch === "function") {

      .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error("x")); })
      .then(function (d) {
        d.forEach(function (r) {
          var line = repoLines[r.name]; if (!line) return;
          if (r.stargazers_count > 0) line.appendChild(el("span", null, "★ " + r.stargazers_count));
          var when = r.pushed_at || r.updated_at;
          if (when) line.appendChild(el("span", null, new Date(when).toLocaleDateString("en-US", { month: "short", year: "numeric" })));
        });

  }
})();

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
  }
}
</script>
<script type="module">
/* Live CAD viewer.
 *
 * Lighting follows the Ramtech-Web CAD viewer: a RoomEnvironment studio IBL with
 * neutral tone mapping, and base colours scaled 0.82 on load because
 * powder-coated parts export as pure 1.0 white and otherwise clip to one blob.
 * Ramtech-Web calibrates exposure at 0.45 against SolidWorks on a single part;
 * a whole assembly with AO reads darker, so this page runs a little brighter.
 */
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js";

const VIEWER_EXPOSURE = 0.5;
const BASE_COLOR_SCALE = 0.82;
const CLEAR_TRANSPARENCY = 0.8;   // SolidWorks transparency for clear polycarbonate
const MATTE_ROUGHNESS = 0.8;      // what Ramtech-Web's converter writes for every part
const METAL_MIN_ROUGHNESS = 0.3;  // mirror-polished metals only flash at one angle; this keeps a visible sheen

// glTF-Transform palette textures store each part's roughness (G) and
// metalness (B) as texels. Authored metals (gold, steel) keep their finish;
// every non-metal texel is made converter-matte.
const mrCache = new Map();
function matteNonMetals(tex) {
  if (mrCache.has(tex)) return mrCache.get(tex);
  const im = tex.image, c = document.createElement("canvas");
  c.width = im.width; c.height = im.height;
  const x = c.getContext("2d");
  x.drawImage(im, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height);
  const g = Math.round(MATTE_ROUGHNESS * 255);
  const gm = Math.round(METAL_MIN_ROUGHNESS * 255);
  for (let i = 0; i < d.data.length; i += 4) {
    if (d.data[i + 2] < 128) d.data[i + 1] = g;
    else d.data[i + 1] = Math.max(d.data[i + 1], gm);
  }
  x.putImageData(d, 0, 0);
  const t = new THREE.CanvasTexture(c);
  for (const k of ["flipY", "colorSpace", "wrapS", "wrapT", "magFilter", "minFilter", "channel", "rotation", "matrixAutoUpdate"]) t[k] = tex[k];
  t.offset.copy(tex.offset); t.repeat.copy(tex.repeat); t.center.copy(tex.center); t.matrix.copy(tex.matrix);
  mrCache.set(tex, t);
  return t;
}
const DRACO_PATH = "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/libs/draco/";

window.__mount3D = function (host, url, opts) {
  opts = opts || {};
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.toneMappingExposure = 1;      // dropped to CAD_EXPOSURE below, if warranted
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  const canvas = renderer.domElement;
  canvas.style.width = "100%";
  canvas.style.height = "100%";
  host.appendChild(canvas);

  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  // how much the neutral studio light fills the model in; lowering it keeps
  // the model's own lights doing the work and lets the shadows stay dark
  if (typeof opts.env === "number") scene.environmentIntensity = opts.env;

  const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 1000);
  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.autoRotateSpeed = 1.6;
  const spin = opts.spin !== false;
  // the spin waits for the model, so it never starts on an empty frame
  controls.autoRotate = false;

  // Once someone takes hold of it the idle spin stops, so it never drags the
  // view out from under what they lined up. Restore eases back to the opening
  // shot and picks the spin up again.
  const restore = document.createElement("button");
  restore.type = "button";
  restore.className = "model-reset";
  restore.setAttribute("aria-label", "Restore the starting view");
  restore.innerHTML = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 6.6A3.9 3.9 0 1 0 3.3 3.2"/><path d="M2.4 1.6v2.1h2.1"/></svg>Restore';
  host.appendChild(restore);
  let home = null, tween = null;
  controls.addEventListener("start", () => {
    tween = null;
    controls.autoRotate = false;
    if (home) restore.classList.add("on");
  });
  restore.addEventListener("click", (e) => {
    e.stopPropagation();
    if (!home) return;
    restore.classList.remove("on");
    tween = { t0: performance.now(), pos: camera.position.clone(), tgt: controls.target.clone() };
  });

  // Same pipeline as the Ramtech-Web viewer: render into an HDR float buffer
  // and let OutputPass do the tone mapping, rather than tone mapping in the
  // material shaders on a direct render. (Its OutlinePass is for part picking,
  // which this page has no use for, and is a pass-through when nothing is
  // selected.)
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));

  // shade at vertices, so large flat faces get none without this.
  const gtao = opts.ao !== false ? new GTAOPass(scene, camera, 1, 1) : null;
  if (gtao) composer.addPass(gtao);
  composer.addPass(new OutputPass());

    const w = host.clientWidth || 1, h = host.clientHeight || 1;

  new GLTFLoader().setDRACOLoader(draco).setMeshoptDecoder(MeshoptDecoder).load(
    url,
    (gltf) => {
      if (disposed) return;
      root = gltf.scene;

      renderer.toneMappingExposure =
        typeof opts.exposure === "number" ? opts.exposure : VIEWER_EXPOSURE;

      const seen = new Set();
      root.traverse((o) => {
        if (!o.isMesh) return;

            mat.metalnessMap = mat.roughnessMap = matteNonMetals(mat.metalnessMap);
            mat.metalness = 1;
            mat.roughness = 1;
          } else {
            mat.metalnessMap = mat.roughnessMap = null;
            mat.metalness = 0;
            mat.roughness = MATTE_ROUGHNESS;
          }

            // (alpha = 1 - SolidWorks transparency), not physical transmission,
            // which renders frosted grey at roughness 0.8.
            if (mat.transmission > 0) {

              mat.side = THREE.DoubleSide;
            }

      // catch a highlight from, and gold reads as dull olive.
      scene.add(root);

      // Rico 1.0 m tall instead of 0.62 m and framed it far too loosely
      const box = new THREE.Box3().setFromObject(root, true);
      const sphere = box.getBoundingSphere(new THREE.Sphere());
      const center = box.getCenter(new THREE.Vector3());
      const dir = new THREE.Vector3(0.55, 0.42, 0.72).normalize();

      // Fit the model's actual shape, not its bounding sphere or box: both are
      // padded with empty corners the robot never fills, which left it small in
      // a big empty plate. The distance is fixed for the whole orbit: it frames
      // the opening shot with room for the corner labels, or just fits the
      // robot's widest angle, whichever is further.
      const pts = [], v = new THREE.Vector3();
      root.traverse((o) => {
        const pos = o.isMesh && o.geometry && o.geometry.attributes.position;
        if (!pos) return;
        const step = Math.max(1, Math.floor(pos.count / 3000));
        for (let i = 0; i < pos.count; i += step) {
          pts.push(v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld).sub(center).clone());
        }
      });
      const up = new THREE.Vector3(0, 1, 0);
      const elev = Math.asin(dir.y), az0 = Math.atan2(dir.x, dir.z);
      const tanV = Math.tan((camera.fov * Math.PI) / 360), tanH = tanV * camera.aspect;
      const FIT_MARGIN = 1.12, STEPS = 72;   // room for the corner labels
      const basis = (az) => {
        const d = new THREE.Vector3(Math.cos(elev) * Math.sin(az), Math.sin(elev), Math.cos(elev) * Math.cos(az));
        const r = new THREE.Vector3().crossVectors(up, d).normalize();
        return { d, r, u: new THREE.Vector3().crossVectors(d, r) };
      };
      const fitFor = (az) => {
        const { d, r, u } = basis(az);
        let need = 0;
        for (const p of pts) {
          const z = p.dot(d);
          need = Math.max(need, Math.abs(p.dot(r)) / tanH + z, Math.abs(p.dot(u)) / tanV + z);
        }
        return need || sphere.radius * 2;
      };
      // Seen from above, a robot's silhouette sits low around its box centre.
      // Lift the orbit's pivot so the opening shot is centred top to bottom.
      {
        const D = fitFor(az0), { d, u } = basis(az0);
        let lo = Infinity, hi = -Infinity;
        for (const p of pts) { const y = p.dot(u) / (D - p.dot(d)); lo = Math.min(lo, y); hi = Math.max(hi, y); }
        const dy = ((lo + hi) / 2) * D / Math.cos(elev);
        center.y += dy;
        for (const p of pts) p.y -= dy;
      }
      let widest = 0;
      for (let k = 0; k < STEPS; k++) widest = Math.max(widest, fitFor((k / STEPS) * Math.PI * 2));
      const dist = Math.max(fitFor(az0) * FIT_MARGIN, widest * 1.02);
      const far = dist;
      controls.target.copy(center);
      camera.position.copy(center).add(dir.clone().multiplyScalar(dist));
      camera.near = Math.max(dist / 1000, 1e-4);
      camera.far = far * 12;
      camera.updateProjectionMatrix();
      controls.update();
      home = { pos: camera.position.clone(), tgt: center.clone() };
      controls.autoRotate = spin;

      // AO radius has to follow the model's scale, so it is set once the
      // bounding sphere is known rather than guessed at a world size
      if (gtao) {
        gtao.updateGtaoMaterial({
          radius: Math.max(sphere.radius * 0.16, 0.02),
          distanceExponent: 1,
          thickness: Math.max(sphere.radius * 0.16, 0.02),
          // matched by eye to the Ramtech-Web display render of the same robot
          scale: 1.6,
          samples: 16
        });
      }

      host.classList.add("ready");
      const tick = (now) => {
        if (tween) {
          const t = Math.min((now - tween.t0) / 700, 1), e = 1 - Math.pow(1 - t, 3);
          camera.position.lerpVectors(tween.pos, home.pos, e);
          controls.target.lerpVectors(tween.tgt, home.tgt, e);
          if (t === 1) { tween = null; controls.autoRotate = spin; }
        }
        controls.update(); composer.render(); raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);
    },
    undefined,
    () => {
      if (disposed) return;
      host.classList.add("failed");
      const s = host.querySelector(".model-load span");
      if (s) s.textContent = "3D unavailable";
    }
  );

  return {
    dispose() {
      if (disposed) return;
      disposed = true;
      cancelAnimationFrame(raf);
      ro.disconnect();
      controls.dispose();
      restore.remove();
      if (root) {
        root.traverse((o) => {
          if (!o.isMesh) return;
          o.geometry?.dispose();
          for (const m of (Array.isArray(o.material) ? o.material : [o.material])) m?.dispose();
        });
      }
      scene.environment?.dispose();
      pmrem.dispose();
      draco.dispose();
      composer.dispose();
      renderer.dispose();
      canvas.remove();
    }
  };
};

document.dispatchEvent(new Event("three-ready"));
</script>
